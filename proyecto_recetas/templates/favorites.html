<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function() {
      try {
        const p = JSON.parse(localStorage.getItem('recetafacil_prefs')) || {};
        const h = document.documentElement;
        if (p.dark)     h.classList.add('dark');
        if (p.compact)  h.classList.add('compact');
        if (p.fontSize) h.classList.add('font-' + p.fontSize);
      } catch(e) {}
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecetaFácil – Favoritos</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/favorites.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/preferences.css') }}">
</head>
<body>
<div class="root">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/>
          <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
        </svg>
      </div>
      <span class="logo-name">RecetaFácil</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn" onclick="window.location.href='/dashboard'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Inicio</span>
      </button>
      <button class="nav-btn" onclick="window.location.href='/recipe'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>Recetas</span>
      </button>
      <button class="nav-btn nav-btn--active">
        <svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.5)" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        <span>Favoritos</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-btn" onclick="window.location.href='/profile'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>Mi Perfil</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="main-scroll">
      <div class="content">

        <div class="topbar">
          <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Volver
          </button>
        </div>

        <div class="heading">
          <h1>Mis Favoritos</h1>
          <p>Recetas que has guardado para cocinar después</p>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-label">Total guardadas</div>
            <div class="stat-val" id="stat-total">0</div>
            <div class="stat-sub">recetas en tu colección</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Tiempo promedio</div>
            <div class="stat-val">
              <span id="stat-time">0</span>
              <span class="stat-unit">min</span>
            </div>
            <div class="stat-sub">de preparación</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Categoría top</div>
            <div class="stat-val stat-accent" id="stat-top">–</div>
            <div class="stat-sub">la más guardada</div>
          </div>
        </div>

        <div class="collections-bar">
          <span class="section-title">Colecciones</span>
          <button class="btn-new-col" onclick="openModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Nueva colección
          </button>
        </div>

        <div class="collections-scroll" id="collections-scroll"></div>

        <div class="controls-row">
          <div class="controls-left">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input id="search-input" class="search-input" type="text" placeholder="Buscar en favoritos..." oninput="filterRecipes()" />
            </div>
            <div class="view-toggle">
              <button class="view-btn view-btn--active" id="btn-grid" onclick="setView('grid')" title="Vista grilla">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                  <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                </svg>
              </button>
              <button class="view-btn" id="btn-list" onclick="setView('list')" title="Vista lista">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                  <line x1="8" y1="18" x2="21" y2="18"/>
                  <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
                  <line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="result-count">
            <strong id="visible-count">0</strong> recetas mostradas
          </div>
          <select class="sort-select" onchange="sortRecipes(this.value)">
            <option value="date">Más recientes</option>
            <option value="name">A–Z</option>
            <option value="time">Más rápidas</option>
            <option value="kcal">Menos calorías</option>
          </select>
        </div>

        <div id="fav-container"></div>

        <div class="spacer"></div>

      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <p class="modal-title">Nueva colección</p>
    <input
      class="modal-input"
      id="col-name-input"
      type="text"
      placeholder="Ej. Cenas rápidas, Desayunos..."
      maxlength="30"
      onkeydown="if(event.key==='Enter') createCollection()"
    />
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-create" onclick="createCollection()">Crear</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="{{ url_for('static', filename='js/favorites.js') }}"></script>
</body>
</html>
