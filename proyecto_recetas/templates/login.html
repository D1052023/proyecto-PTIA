<!DOCTYPE html>
<html lang="english">

<head>
    <title>exported project</title>
    <meta property="og:title" content="exported project" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <meta property="twitter:card" content="summary_large_image" />

    <style data-tag="reset-style-sheet">
        html {
            line-height: 1.15;
        }

        body {
            margin: 0;
        }

        * {
            box-sizing: border-box;
            border-width: 0;
            border-style: solid;
            -webkit-font-smoothing: antialiased;
        }

        p,
        li,
        ul,
        pre,
        div,
        h1,
        h2,
        h3,
        h4,
        h5,
        h6,
        figure,
        blockquote,
        figcaption {
            margin: 0;
            padding: 0;
        }

        button {
            background-color: transparent;
        }

        button,
        input,
        optgroup,
        select,
        textarea {
            font-family: inherit;
            font-size: 100%;
            line-height: 1.15;
            margin: 0;
        }

        button,
        select {
            text-transform: none;
        }

        button,
        [type="button"],
        [type="reset"],
        [type="submit"] {
            -webkit-appearance: button;
            color: inherit;
        }

        button::-moz-focus-inner,
        [type="button"]::-moz-focus-inner,
        [type="reset"]::-moz-focus-inner,
        [type="submit"]::-moz-focus-inner {
            border-style: none;
            padding: 0;
        }

        button:-moz-focus,
        [type="button"]:-moz-focus,
        [type="reset"]:-moz-focus,
        [type="submit"]:-moz-focus {
            outline: 1px dotted ButtonText;
        }

        a {
            color: inherit;
            text-decoration: inherit;
        }

        pre {
            white-space: normal;
        }

        input {
            padding: 2px 4px;
        }

        img {
            display: block;
        }

        details {
            display: block;
            margin: 0;
            padding: 0;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        [data-thq="accordion"] [data-thq="accordion-content"] {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
            padding: 0;
        }

        [data-thq="accordion"] details[data-thq="accordion-trigger"][open]+[data-thq="accordion-content"] {
            max-height: 1000vh;
        }

        details[data-thq="accordion-trigger"][open] summary [data-thq="accordion-icon"] {
            transform: rotate(180deg);
        }

        html {
            scroll-behavior: smooth
        }
    </style>
    <style data-tag="default-style-sheet">
        html {
            font-family: Inter;
            font-size: 16px;
        }

        body {
            font-weight: 400;
            font-style: normal;
            text-decoration: none;
            text-transform: none;
            letter-spacing: normal;
            line-height: 1.15;
            color: var(--dl-color-theme-neutral-dark);
            background: var(--dl-color-theme-neutral-light);

            fill: var(--dl-color-theme-neutral-dark);
        }
    </style>
    <link rel="stylesheet" href="https://unpkg.com/animate.css@4.1.1/animate.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
        data-tag="font" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
        data-tag="font" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap"
        data-tag="font" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&amp;display=swap"
        data-tag="font" />
    <link rel="stylesheet" href="https://unpkg.com/@teleporthq/teleport-custom-scripts/dist/style.css" />
</head>

<body>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <div>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

        <div class="iniciodesesinmvil-container1">
            <div class="iniciodesesinmvil-thq-holidays-planner-elm">
                <div class="iniciodesesinmvil-thq-container-elm10">
                    <img src="{{ url_for('static', filename='public/fondologin.svg') }}" alt=""
                        class="iniciodesesinmvil-bg-img" />
                </div>
                <div class="iniciodesesinmvil-thq-container-elm11">
                    <div class="iniciodesesinmvil-thq-container-elm12">
                        <div class="iniciodesesinmvil-thq-container-elm13">
                            <div class="iniciodesesinmvil-thq-container-elm14">
                                <img alt="X388" src="{{ url_for('static', filename='public/x.svg') }}"
                                    class="iniciodesesinmvil-thq-x-elm" />
                            </div>
                            <div class="iniciodesesinmvil-thq-text-elm11">
                                <span class="iniciodesesinmvil-thq-text-elm12">
                                    RecetaFácil
                                </span>
                            </div>
                        </div>
                        <div class="iniciodesesinmvil-thq-heading1-elm">
                            <span class="iniciodesesinmvil-thq-text-elm13">
                                Bienvenido de nuevo
                            </span>
                        </div>
                        <div class="iniciodesesinmvil-thq-paragraph-elm1">
                            <span class="iniciodesesinmvil-thq-text-elm14">
                                Inicia sesión para continuar cocinando
                            </span>
                        </div>
                        <form class="iniciodesesinmvil-thq-form-elm" method="POST" action="/">
                            <div class="iniciodesesinmvil-thq-container-elm15">
                                <div class="iniciodesesinmvil-thq-label-elm1">
                                    <span class="iniciodesesinmvil-thq-text-elm15">
                                        Correo electrónico
                                    </span>
                                </div>
                                <div class="iniciodesesinmvil-thq-container-elm16">
                                    <input type="email" id="email" name="email" placeholder="tu@email.com"
                                        class="iniciodesesinmvil-thq-email-input-elm" required />


                                    <img src="{{ url_for('static', filename='public/mail.svg') }}" alt="Icon1511"
                                        class="iniciodesesinmvil-thq-icon-elm1" />
                                </div>
                            </div>
                            <div class="iniciodesesinmvil-thq-container-elm17">
                                <div class="iniciodesesinmvil-thq-label-elm2">
                                    <span class="iniciodesesinmvil-thq-text-elm16">
                                        Contraseña
                                    </span>
                                </div>
                                <div class="iniciodesesinmvil-thq-container-elm18">
                                    <input type="password" id="password" name="password" placeholder="••••••••"
                                        class="iniciodesesinmvil-thq-password-input-elm" required />
                                    <img src="{{ url_for('static', filename='public/lock.svg') }}" alt="Icon1511"
                                        class="iniciodesesinmvil-thq-icon-elm2" />
                                    <button type="button" id="togglePassword" class="iniciodesesinmvil-thq-button-elm1">

                                        <img id="eyeIcon" src="{{ url_for('static', filename='public/eye.svg') }}"
                                            alt="Icon1511" class="iniciodesesinmvil-thq-icon-elm3" />

                                    </button>

                                </div>
                            </div>
                            <div class="iniciodesesinmvil-thq-div-elm">
                                <div class="iniciodesesinmvil-thq-container-elm19">
                                    <input type="checkbox" id="rememberMe" class="iniciodesesinmvil-thq-checkbox-elm">
                                    <div class="iniciodesesinmvil-thq-label-elm3">
                                        <span class="iniciodesesinmvil-thq-text-elm17">
                                            Recordarme
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <div class="iniciodesesinmvil-thq-container-elm20">
                                <div class="iniciodesesinmvil-thq-link-elm"
                                    onclick="window.location.href='/forgotPassword'">
                                    <span class="iniciodesesinmvil-thq-text-elm18">
                                        ¿Olvidaste tu contraseña?
                                    </span>
                                </div>
                            </div>

                            <button type="submit" class="iniciodesesinmvil-thq-button-elm2">
                                <span class="iniciodesesinmvil-thq-text-elm19">
                                    Iniciar Sesión
                                </span>
                            </button>
                            {% with messages = get_flashed_messages() %}
                            {% if messages %}
                            <p style="color:red; text-align:center; margin-top:10px;">
                                {{ messages[0] }}
                            </p>
                            {% endif %}
                            {% endwith %}

                        </form>
                        <div class="iniciodesesinmvil-thq-container-elm21">
                            <div class="iniciodesesinmvil-thq-container-elm22"></div>
                            <div class="iniciodesesinmvil-thq-text-elm20">
                                <span class="iniciodesesinmvil-thq-text-elm21">
                                    O continúa con
                                </span>
                            </div>
                            <div class="iniciodesesinmvil-thq-container-elm23"></div>
                        </div>
                        <div class="iniciodesesinmvil-thq-container-elm24">
                            <button class="iniciodesesinmvil-thq-button-elm3"
                                onclick="window.location.href='/login/google'">
                                <img src="{{ url_for('static', filename='public/google.svg') }}" alt="Icon1511"
                                    class="iniciodesesinmvil-thq-icon-elm4" />
                            </button>
                        </div>
                        <div class="iniciodesesinmvil-thq-paragraph-elm2">
                            <span class="iniciodesesinmvil-thq-text-elm22">
                                <span class="iniciodesesinmvil-thq-text-elm23">
                                    ¿No tienes una cuenta?
                                </span>
                                <button class="iniciodesesinmvil-thq-button-elm7"
                                    onclick="window.location.href='/register'">
                                    <span class="registro-thq-text-elm19">
                                        Regístrate
                                    </span>
                                </button>
                                </button>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>

            const toggleBtn = document.getElementById("togglePassword");
            const passwordInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eyeIcon");

            toggleBtn.addEventListener("click", function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";
                    eyeIcon.src = "{{ url_for('static', filename='public/noeye.svg') }}";

                } else {

                    passwordInput.type = "password";
                    eyeIcon.src = "{{ url_for('static', filename='public/eye.svg') }}";

                }

            });

        </script>
        <script>

            const emailInput = document.getElementById("email");
            const rememberCheckbox = document.getElementById("rememberMe");
            const form = document.querySelector("form");

            window.addEventListener("load", () => {

                const savedEmail = localStorage.getItem("rememberedEmail");

                if (savedEmail) {
                    emailInput.value = savedEmail;
                    rememberCheckbox.checked = true;
                }

            });

            form.addEventListener("submit", () => {

                if (rememberCheckbox.checked) {
                    localStorage.setItem("rememberedEmail", emailInput.value);
                } else {
                    localStorage.removeItem("rememberedEmail");
                }

            });

        </script>

</body>

</html>
