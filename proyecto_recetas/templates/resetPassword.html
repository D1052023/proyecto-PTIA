<!DOCTYPE html>
<html lang="spanish">
<head>
  <title>RecetaFácil - Revisa tu correo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="utf-8" />
  <style>
    html{line-height:1.15}body{margin:0}*{box-sizing:border-box;border-width:0;border-style:solid;-webkit-font-smoothing:antialiased}
    p,li,ul,pre,div,h1,h2,h3,h4,h5,h6,figure,blockquote,figcaption{margin:0;padding:0}
    button{background-color:transparent}a{color:inherit;text-decoration:inherit}img{display:block}
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/resetPassword.css') }}">
</head>
<body>

  <div class="de-thq-holidays-planner-elm">

    <!-- Capa 1: imagen de fondo -->
    <div class="de-thq-container-elm1">
      <img src="{{ url_for('static', filename='public/fondologin.svg') }}" alt="" />
    </div>

    <!-- Capa 2: overlay verde (pointer-events: none en CSS) -->
    <div class="de-thq-container-elm2"></div>

    <!-- Capa 3: card encima del overlay -->
    <div class="de-thq-container-elm3">

      <!-- Logo -->
      <div class="de-thq-container-elm4">
        <div class="de-thq-container-elm5">
          <img src="{{ url_for('static', filename='public/x.svg') }}" alt="Logo" class="con-thq-icon-elm1" />
        </div>
        <div class="de-thq-text-elm2">
          <span class="de-thq-text-elm3">RecetaFácil</span>
        </div>
      </div>

      <!-- Icono check -->
      <div class="de-thq-container-elm6">
        <div class="de-thq-container-elm7">
          <img src="{{ url_for('static', filename='public/checkcircle.svg') }}" alt="" class="de-thq-icon-elm1" />
        </div>
      </div>

      <!-- Título -->
      <div class="de-thq-heading1-elm">
        <span class="de-thq-text-elm4">¡Revisa tu correo!</span>
      </div>

      <!-- Párrafo 1 -->
      <div class="de-thq-paragraph-elm1">
        <span class="de-thq-text-elm5">
          Hemos enviado las instrucciones para restablecer tu contraseña a
        </span>
      </div>

      <!-- Email -->
      <div class="de-thq-paragraph-elm2">
        <span class="de-thq-text-elm6">paco.andres03@gmail.com</span>
      </div>

      <!-- Párrafo 2 -->
      <div class="de-thq-paragraph-elm3">
        <span class="de-thq-text-elm7">
          Si no recibes el correo en los próximos minutos, revisa la
          carpeta de spam o correo no deseado
        </span>
      </div>

      <!-- Botón -->
      <button class="de-thq-button-elm" onclick="window.location.href='/resetPassword'">
        <span class="de-thq-text-elm8">Reenviar correo</span>
      </button>

      <!-- Volver -->
      <div class="de-thq-link-elm" onclick="window.location.href='/'">
        <img src="{{ url_for('static', filename='public/return.svg') }}" alt="" class="de-thq-icon-elm2" />
        <span class="de-thq-text-elm9">Volver al inicio de sesión</span>
      </div>

    </div>
  </div>

</body>
</html>
