<!DOCTYPE html>
<html lang="spanish">
<head>
  <title>RecetaFácil - Nueva contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta charset="utf-8" />
  <style>
    html{line-height:1.15}body{margin:0}*{box-sizing:border-box;border-width:0;border-style:solid;-webkit-font-smoothing:antialiased}
    p,li,ul,pre,div,h1,h2,h3,h4,h5,h6,figure,blockquote,figcaption{margin:0;padding:0}
    button{background-color:transparent}a{color:inherit;text-decoration:inherit}img{display:block}
    button,input{font-family:inherit;font-size:100%;line-height:1.15;margin:0}
    button,[type="button"],[type="submit"]{-webkit-appearance:button;color:inherit}
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/newPassword.css') }}">
</head>
<body>

  <div class="np-wrapper">

    <!-- Capa 1: imagen de fondo -->
    <div class="np-bg">
      <img src="{{ url_for('static', filename='public/fondologin.svg') }}" alt="" />
    </div>

    <!-- Capa 2: overlay verde -->
    <div class="np-overlay"></div>

    <!-- Capa 3: card -->
    <div class="np-card">

      <!-- Logo -->
      <div class="np-logo">
        <div class="np-logo-icon">
          <img src="{{ url_for('static', filename='public/x.svg') }}" alt="Logo" />
        </div>
        <span class="np-logo-text">RecetaFácil</span>
      </div>

      <!-- Ícono candado -->
      <div class="np-icon-wrap">
        <div class="np-icon-circle">
          <img src="{{ url_for('static', filename='public/lock.svg') }}" alt="" class="np-icon" />
        </div>
      </div>

      <!-- Títulos -->
      <h1 class="np-title">Nueva contraseña</h1>
      <p class="np-subtitle">Crea una contraseña segura para tu cuenta</p>

      <!-- Formulario -->
      <form method="POST" class="np-form">

        <!-- Nueva contraseña -->
        <div class="np-field">
          <label class="np-label">Nueva contraseña</label>
          <div class="np-input-wrap">
            <img src="{{ url_for('static', filename='public/lock.svg') }}" alt="" class="np-input-icon" />
            <input type="password" id="password" name="password" placeholder="••••••••" class="np-input" required />
            <button type="button" id="togglePassword" class="np-eye-btn">
              <img id="eyeIcon1" src="{{ url_for('static', filename='public/eye.svg') }}" alt="Ver" class="np-eye-icon" />
            </button>
          </div>
        </div>

        <!-- Confirmar contraseña -->
        <div class="np-field">
          <label class="np-label">Confirmar contraseña</label>
          <div class="np-input-wrap">
            <img src="{{ url_for('static', filename='public/lock.svg') }}" alt="" class="np-input-icon" />
            <input type="password" id="confirm" name="confirm" placeholder="••••••••" class="np-input" required />
            <button type="button" id="toggleConfirm" class="np-eye-btn">
              <img id="eyeIcon2" src="{{ url_for('static', filename='public/eye.svg') }}" alt="Ver" class="np-eye-icon" />
            </button>
          </div>
        </div>

        <!-- Botón submit -->
        <button type="submit" class="np-btn">
          Cambiar contraseña
        </button>

      </form>

      <!-- Volver -->
      <div class="np-back" onclick="window.location.href='/'">
        <img src="{{ url_for('static', filename='public/return.svg') }}" alt="" class="np-back-icon" />
        <span class="np-back-text">Volver al inicio de sesión</span>
      </div>

    </div>
  </div>

  <script>
    const togglePassword = document.getElementById("togglePassword");
    const passwordInput = document.getElementById("password");
    const eyeIcon1 = document.getElementById("eyeIcon1");

    togglePassword.addEventListener("click", function () {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon1.src = "{{ url_for('static', filename='public/noeye.svg') }}";
      } else {
        passwordInput.type = "password";
        eyeIcon1.src = "{{ url_for('static', filename='public/eye.svg') }}";
      }
    });

    const toggleConfirm = document.getElementById("toggleConfirm");
    const confirmInput = document.getElementById("confirm");
    const eyeIcon2 = document.getElementById("eyeIcon2");

    toggleConfirm.addEventListener("click", function () {
      if (confirmInput.type === "password") {
        confirmInput.type = "text";
        eyeIcon2.src = "{{ url_for('static', filename='public/noeye.svg') }}";
      } else {
        confirmInput.type = "password";
        eyeIcon2.src = "{{ url_for('static', filename='public/eye.svg') }}";
      }
    });
  </script>

</body>
</html>
