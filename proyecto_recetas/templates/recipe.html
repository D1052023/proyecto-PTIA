<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Anti-parpadeo preferencias -->
  <script>
    (function() {
      try {
        const p = JSON.parse(localStorage.getItem('recetafacil_prefs')) || {};
        const h = document.documentElement;
        if (p.dark)     h.classList.add('dark');
        if (p.compact)  h.classList.add('compact');
        if (p.fontSize) h.classList.add('font-' + p.fontSize);
      } catch(e) {}
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecetaFácil – Recetas</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/recipe.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/preferences.css') }}">
</head>
<body>
<div class="root">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>
        </svg>
      </div>
      <span class="logo-name">RecetaFácil</span>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn" onclick="window.location.href='/dashboard'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Inicio</span>
      </button>
      <button class="nav-btn nav-btn--active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Recetas</span>
      </button>
      <button class="nav-btn" id="nav-favs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>Favoritos</span>
      </button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-btn" onclick="window.location.href='/profile'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Mi Perfil</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="main-scroll">
      <div class="content">

        <!-- Top bar -->
        <div class="topbar">
          <button class="back-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            Volver
          </button>
          <div class="search-bar">
            <div class="search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input id="search-input" class="search-input" type="text" placeholder="Buscar receta..." oninput="filterRecipes()" />
            </div>
          </div>
        </div>

        <!-- Heading -->
        <div class="heading">
          <h1 id="result-title">Encontradas: 6 recetas</h1>
          <p>Basadas en tus ingredientes: <strong id="ing-display">Huevo, Cebolla</strong></p>
        </div>

        <!-- Filters -->
        <div class="filters">
          <button class="filter-btn filter-btn--active" onclick="setFilter('todas', this)">Todas</button>
          <button class="filter-btn filter-btn--inactive" onclick="setFilter('populares', this)">Populares</button>
          <button class="filter-btn filter-btn--inactive" onclick="setFilter('rapidas', this)">Más rápidas</button>
          <button class="filter-btn filter-btn--inactive" onclick="setFilter('saludables', this)">Saludables</button>
          <button class="filter-btn filter-btn--inactive" onclick="setFilter('favoritos', this)">⭐ Favoritos</button>
        </div>

        <!-- Sort row -->
        <div class="sort-row">
          <span class="result-count"><strong id="visible-count">6</strong> recetas mostradas</span>
          <select class="sort-select" onchange="sortRecipes(this.value)">
            <option value="match">Mayor coincidencia</option>
            <option value="time">Más rápidas</option>
            <option value="kcal">Menos calorías</option>
            <option value="name">A–Z</option>
          </select>
        </div>

        <!-- Grid -->
        <div class="recipes-grid" id="recipes-grid"></div>

        <!-- Load more -->
        <div class="load-more-wrap">
          <button class="btn-load" onclick="loadMore()">Cargar más recetas</button>
        </div>

      </div>
    </div>
  </main>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content"></div>
</div>

<div id="toast"></div>

<script src="{{ url_for('static', filename='js/recipe.js') }}"></script>
</body>
</html>
