<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Probar Recomendación de Recetas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        form {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input[type="file"] {
            display: block;
            margin: 20px auto;
        }
        button {
            display: block;
            margin: 0 auto;
            padding: 10px 20px;
            background-color: #27ae60;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #219150;
        }
        .result {
            max-width: 500px;
            margin: 20px auto;
            padding: 15px;
            background-color: #ecf0f1;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>Probar Sistema de Recomendación</h1>
    <form action="/recomendar" method="POST" enctype="multipart/form-data">
        <label for="foto">Sube una imagen de un platillo:</label>
        <input type="file" name="foto" id="foto" accept="image/*" required>
        <button type="submit">Probar Modelo</button>
    </form>

    {% if detectado %}
    <div class="result">
        <h2>Resultado de la predicción</h2>
        <p><strong>Platillo detectado:</strong> {{ detectado }}</p>
        <p><strong>Ingredientes identificados:</strong> {{ ingredientes|join(', ') }}</p>
        <h3>Recetas recomendadas:</h3>
        <ul>
            {% for receta in recetas %}
            <li>{{ receta['title'] }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</body>
</html>
